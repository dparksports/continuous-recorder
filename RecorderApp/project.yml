name: RecorderApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  RecorderApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: RecorderApp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recorderapp
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  RecorderAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RecorderApp

schemes:
  RecorderApp:
    build:
      targets:
        RecorderApp: all
        RecorderAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RecorderAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
