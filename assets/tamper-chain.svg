<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t2 d2">
  <title id="t2">Tamper evidence chain: what it detects and what it cannot</title>
  <desc id="d2">Each closed video file produces a link containing its SHA-256 hash and the previous link's hash, signed by an ECDSA P-256 key held in the Secure Enclave. The chain detects an edited byte, a swapped file, a deleted middle link and a forged link. It cannot detect truncation of the tail; only an off-device copy of the chain head does that.</desc>

  <rect width="1200" height="640" fill="#f5f5f5"/>

  <text x="60" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#2d3142">What the chain proves — and what it cannot</text>
  <text x="60" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#6b7280">One link per closed file · SHA-256 chained · ECDSA P-256 from a non-exportable Secure Enclave key</text>

  <!-- link 1 -->
  <rect x="60" y="150" width="230" height="150" rx="6" fill="#ffffff"/>
  <text x="78" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#9aa1ac">LINK 1</text>
  <text x="78" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2d3142">hour-00001.mp4</text>
  <line x1="78" y1="212" x2="272" y2="212" stroke="#2d3142" stroke-opacity="0.1"/>
  <text x="78" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">sha256 9f2c…c4a1</text>
  <text x="78" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">prev   0000…0000</text>
  <text x="78" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6c36">✓ signed</text>

  <!-- link 2 -->
  <rect x="330" y="150" width="230" height="150" rx="6" fill="#ffffff"/>
  <text x="348" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#9aa1ac">LINK 2</text>
  <text x="348" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2d3142">hour-00002.mp4</text>
  <line x1="348" y1="212" x2="542" y2="212" stroke="#2d3142" stroke-opacity="0.1"/>
  <text x="348" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">sha256 41be…07d3</text>
  <text x="348" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">prev   9f2c…c4a1</text>
  <text x="348" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6c36">✓ signed</text>

  <!-- link 3 -->
  <rect x="600" y="150" width="230" height="150" rx="6" fill="#ffffff"/>
  <text x="618" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#9aa1ac">LINK 3</text>
  <text x="618" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2d3142">hour-00003.mp4</text>
  <line x1="618" y1="212" x2="812" y2="212" stroke="#2d3142" stroke-opacity="0.1"/>
  <text x="618" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">sha256 7e58…b920</text>
  <text x="618" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7280">prev   41be…07d3</text>
  <text x="618" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6c36">✓ signed</text>

  <!-- chain arrows -->
  <g stroke="#eb6c36" stroke-width="2" fill="none">
    <line x1="290" y1="225" x2="322" y2="225"/>
    <path d="M316 219 L324 225 L316 231"/>
    <line x1="560" y1="225" x2="592" y2="225"/>
    <path d="M586 219 L594 225 L586 231"/>
  </g>

  <!-- off-device anchor -->
  <rect x="870" y="150" width="270" height="150" rx="6" fill="#2d3142"/>
  <text x="890" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#eb6c36">OFF-DEVICE</text>
  <text x="890" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ffffff">WORM storage + head</text>
  <text x="890" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9cdd6">Object lock, compliance mode.</text>
  <text x="890" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9cdd6">Every chain head archived.</text>
  <text x="890" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9cdd6">Heartbeat every 60 s.</text>

  <g stroke="#2d3142" stroke-width="2" fill="none" stroke-dasharray="4 3">
    <line x1="830" y1="225" x2="862" y2="225"/>
    <path d="M856 219 L864 225 L856 231"/>
  </g>

  <!-- detected -->
  <rect x="60" y="360" width="620" height="150" rx="6" fill="#ffffff"/>
  <rect x="60" y="360" width="4" height="150" rx="2" fill="#eb6c36"/>
  <text x="84" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#eb6c36">DETECTED</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#2d3142">
    <text x="84" y="422">One byte changed in a file</text>
    <text x="84" y="446">A file swapped for another of the same size</text>
    <text x="84" y="470">A middle link deleted or reordered</text>
    <text x="84" y="494">A forged link — the key never leaves the enclave</text>
  </g>

  <!-- not detected -->
  <rect x="720" y="360" width="420" height="150" rx="6" fill="#ffffff"/>
  <rect x="720" y="360" width="4" height="150" rx="2" fill="#b45309"/>
  <text x="744" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#b45309">NOT DETECTED LOCALLY</text>
  <text x="744" y="422" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2d3142">The tail truncated</text>
  <text x="744" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280">Delete the last three links and the</text>
  <text x="744" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280">remainder is still self-consistent.</text>
  <text x="744" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#b45309">Only the off-device copy reveals it.</text>

  <!-- footer -->
  <line x1="60" y1="552" x2="1140" y2="552" stroke="#2d3142" stroke-opacity="0.12"/>
  <text x="60" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7280">Tamper-evident, not tamper-proof: whoever holds the device can delete files. The chain makes it visible; the copy off-device makes it survivable.</text>
  <text x="60" y="604" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa1ac">Spec and verifier order: RecorderApp/Docs/TAMPER-EVIDENCE.md</text>
</svg>
